<!-- @dsCard group="Colors" viewport="700x150" subtitle="语义色与状态点：绿=完成 金=进行中 红=失败" name="Semantic States" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);background:var(--bg-base);color:var(--text-secondary);display:flex;gap:12px;padding:18px;font-size:12px}
.c{flex:1;background:var(--surface-card);border-radius:12px;padding:14px;display:flex;align-items:center;gap:9px;height:66px;box-sizing:border-box}
.dot{width:6px;height:6px;border-radius:50%}</style></head><body>
<div class="c"><span class="dot" style="background:var(--success)"></span>已完成 <span style="color:var(--text-faint)">#5E9E78 / 亮 #15803D</span></div>
<div class="c"><span class="dot" style="background:var(--gold-500)"></span>进行中 <span style="color:var(--text-faint)">#F5A623</span></div>
<div class="c"><span class="dot" style="background:var(--danger)"></span>未完成 <span style="color:var(--text-faint)">#E5484D</span></div>
<div class="c" style="color:var(--text-disabled)">休息日 · 整体降灰</div>
</body></html>
