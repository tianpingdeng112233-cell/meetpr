<!-- @dsCard group="Spacing" viewport="700x170" subtitle="四档圆角 + 胶囊；44px 最小触区" name="Radius Scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);background:var(--bg-base);color:var(--text-muted);display:flex;gap:12px;padding:18px;font-size:10.5px;text-align:center}
.b{flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);height:92px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px}</style></head><body>
<div class="b" style="border-radius:var(--radius-chip)">10 · chip</div>
<div class="b" style="border-radius:var(--radius-control)">12 · control</div>
<div class="b" style="border-radius:var(--radius-card)">16 · card</div>
<div class="b" style="border-radius:var(--radius-modal)">20 · modal</div>
<div class="b" style="border-radius:var(--radius-pill);background:var(--gold-cta);color:var(--ink-on-gold);font-weight:700">999 · pill</div>
</body></html>
