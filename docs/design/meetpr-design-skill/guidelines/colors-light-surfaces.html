<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono)}
.wrap{background:#F5F6F8;display:flex;gap:10px;padding:18px}
.sw{flex:1;border-radius:12px;padding:10px 12px;height:112px;display:flex;flex-direction:column;justify-content:flex-end;font-size:10.5px;color:#6B7280}</style></head><body>
<div class="wrap">
<div class="sw" style="background:#F5F6F8;border:1px dashed #D1D5DB">--bg-base<br>#F5F6F8</div>
<div class="sw" style="background:#fff;box-shadow:0 4px 18px rgba(17,24,39,.06)">--surface-card<br>#FFFFFF + shadow</div>
<div class="sw" style="background:#F3F4F6">--surface-key<br>#F3F4F6</div>
<div class="sw" style="background:#D97706;color:#fff">--gold-500<br>#D97706</div>
<div class="sw" style="background:#111827;color:#fff">--cta-bg<br>#111827</div>
<div class="sw" style="background:#FEF3C7;color:#92400E">--gold-200<br>#FEF3C7</div>
</div>
</body></html>
