<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-body);background:var(--bg-base);display:flex;align-items:center;gap:24px;padding:24px}
.cta{position:relative;overflow:hidden;background:var(--gold-cta);color:var(--ink-on-gold);border-radius:var(--radius-pill);padding:15px 34px;font-weight:800;font-size:16px;box-shadow:var(--shadow-cta);display:flex;flex-direction:column;align-items:center;gap:4px}
.sub{font-family:var(--font-mono);font-size:12px;font-weight:700;color:rgba(20,20,20,.72);letter-spacing:.06em}
ul{margin:0;padding-left:16px;font-family:var(--font-mono);font-size:11px;color:var(--text-muted);line-height:1.9}</style></head><body>
<div class="cta"><span class="mp-shimmer"></span><span style="position:relative;display:inline-flex;align-items:center;gap:7px"><svg width="13" height="13" viewBox="0 0 24 24" fill="#141414"><path d="M7 4.5v15c0 .8.9 1.3 1.6.9l12-7.5c.6-.4.6-1.4 0-1.8l-12-7.5c-.7-.4-1.6.1-1.6.9z"></path></svg>开始训练</span><span class="sub" style="position:relative">蹲 · 推 · 拉</span></div>
<ul>
<li>纯色 #FFB800 + 黑字 #141414</li>
<li>inset 顶部白高光 + 底部暗金收边</li>
<li>0 8px 26px 金投影（--shadow-cta）</li>
<li>.mp-shimmer 光泽带仅用于最高层级入口</li>

</ul>
</body></html>
