<!-- @dsCard group="Colors" viewport="700x170" subtitle="暗色表面层级：底 < 嵌入 < 堆叠 < 卡片 < 浮起" name="Dark Surfaces" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;font-family:var(--font-mono);background:var(--bg-base);display:flex;gap:10px;padding:18px;align-items:stretch}
.sw{flex:1;border-radius:12px;padding:10px 12px;height:112px;display:flex;flex-direction:column;justify-content:flex-end;font-size:10.5px;color:var(--text-muted);border:1px solid var(--border-subtle)}</style></head><body>
<div class="sw" style="background:var(--bg-base)">--bg-base<br>#0A0A0C</div>
<div class="sw" style="background:var(--bg-inset)">--bg-inset<br>#101014</div>
<div class="sw" style="background:var(--bg-stack)">--bg-stack<br>#121217</div>
<div class="sw" style="background:var(--surface-card)">--surface-card<br>#141416</div>
<div class="sw" style="background:var(--surface-elevated)">--surface-elevated<br>#161618</div>
<div class="sw" style="background:var(--surface-key)">--surface-key<br>#1C1C20</div>
</body></html>
