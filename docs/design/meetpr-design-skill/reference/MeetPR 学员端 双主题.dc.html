<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
html,body{margin:0;padding:0}
a{color:#D97706;text-decoration:none}
a:hover{color:#B45309}
</style>
</helmet>
<div style="position:relative;min-height:100vh">
<sc-if value="{{ isDark }}" hint-placeholder-val="{{ true }}">
<dc-import name="MeetPR 学员端" hint-size="100%,940px"></dc-import>
</sc-if>
<sc-if value="{{ isLight }}" hint-placeholder-val="{{ false }}">
<dc-import name="MeetPR 学员端 亮色" hint-size="100%,940px"></dc-import>
</sc-if>
<div style="position:fixed;left:50%;top:32px;transform:translateX(-50%) translateX(300px);z-index:50;display:flex;flex-direction:column;align-items:center;gap:8px">
<div class="pb" onclick="{{ toggle }}" style="display:flex;align-items:center;gap:3px;background:{{ pillBg }};border:1px solid {{ pillBd }};border-radius:999px;padding:4px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25);user-select:none">
<span style="{{ darkChipStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"></path></svg>暗色</span>
<span style="{{ lightChipStyle }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M19.1 4.9l-1.8 1.8M6.7 17.3l-1.8 1.8"></path></svg>亮色</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { theme: 'dark' };
  renderVals(){
    const dark = (this.state.theme||'dark')==='dark';
    const chip = (on)=>`display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:7px 13px;border-radius:999px;font-family:'IBM Plex Mono','Noto Sans SC',monospace;transition:background .15s ease,color .15s ease;${on?'background:#F5A623;color:#141414':'color:#8A8A90'}`;
    return {
      isDark: dark, isLight: !dark,
      toggle: ()=>this.setState(s=>({theme: s.theme==='dark'?'light':'dark'})),
      pillBg: dark?'rgba(20,20,22,.9)':'rgba(255,255,255,.95)',
      pillBd: dark?'#2A2A2E':'#E5E7EB',
      darkChipStyle: chip(dark),
      lightChipStyle: chip(!dark)
    };
  }
}
</script>
</body>
</html>
