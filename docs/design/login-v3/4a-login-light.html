<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeetPR 学员端 · 登录页(浅色定稿 4a)</title>
<!-- 设计源:David 2026-07-30 提供的《MeetPR 登录 + 绑定教练(浅色)》设计稿,
     本文件只抽出 4a 登录页一屏 + v3 浅色 token,作为 iOS 实装的一比一参照物。
     稿子里的 4b/4c/4d(输邀请码 / 确认教练 / 错误态)与仓内机制有冲突,另案处理,故不收录。 -->
<style>
<style>
*{box-sizing:border-box}
:root,.theme-light{
  --bg-deep:#EDEEF1; --bg-base:#F5F6F8; --bg-inset:#FAFAFB;
  --surface-card:#FFFFFF; --surface-elevated:#FFFFFF; --surface-raised:#EEF0F3;
  --border-hairline:#E9EBEE; --border-subtle:#E5E7EB; --border-default:#E5E7EB; --border-strong:#D1D5DB;
  --text-primary:#111827; --text-secondary:#4B5563; --text-tertiary:#5C6371; --text-muted:#5C6371; --text-disabled:#9CA3AF;
  --gold-500:#D97706; --gold-400:#F59E0B; --gold-text:#9A4A06; --ink-on-gold:#FFFFFF;
  --success:#15803D; --danger:#DC2626; --danger-text:#B91C1C;
}
body{margin:0;background:#EDEEF1;color:#111827;font-family:'IBM Plex Sans','Noto Sans SC',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#9A4A06;text-decoration:none;border-bottom:1px solid rgba(154,74,6,.35)}
a:hover{color:#D97706}
</style>
</style>
</head>
<body class="theme-light" style="padding:48px;background:#EDEEF1">
<div id="4a" class="theme-light" style="display:flex;flex-direction:column;gap:12px;width:390px">
<div style="display:flex;align-items:center;gap:10px">
<span style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.1em;background:#EDEEF1;color:#111827;padding:4px 9px;border-radius:999px">4a</span>
<span style="font-size:15px;font-weight:700;color:#111827">① 登录 · 浅色定稿</span>
</div>
<p style="margin:0;font-size:12.5px;line-height:1.55;color:#5C6371;min-height:52px">与 <a href="#3c">3c</a> 相同，只删掉底部的邀请码引导（那一步挪到登录之后），空出的位置留给同意条款。</p>
<div style="width:390px;height:844px;background:var(--bg-base);border:1px solid var(--border-strong);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;position:relative">
<div style="position:absolute;inset:0;background:radial-gradient(90% 44% at 50% 0%,rgba(217,119,6,.08),transparent 70%);pointer-events:none"></div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 24px 0;font-size:14px;font-weight:600;color:var(--text-primary);position:relative">
<span>10:40</span>
<div style="display:flex;align-items:center;gap:5px">
<svg width="15" height="12" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M2 8.5a15 15 0 0 1 20 0M5.5 12.5a10 10 0 0 1 13 0M9 16.5a5 5 0 0 1 6 0"></path><circle cx="12" cy="20" r="1" fill="currentColor" stroke="none"></circle></svg>
<span style="width:22px;height:11px;border:1.5px solid currentColor;border-radius:3px;display:inline-flex;align-items:center;padding:1.5px"><span style="flex:1;height:100%;background:var(--success);border-radius:1px"></span></span>
</div>
</div>
<div style="flex:1;display:flex;flex-direction:column;padding:0 24px;position:relative">
<div style="margin-top:44px;display:flex;flex-direction:column;gap:18px">
<div style="align-self:flex-start"><span style="position:relative;display:inline-block;font-family:'Archivo',sans-serif;font-weight:900;font-size:15px;letter-spacing:-.11em;line-height:1"><span style="-webkit-text-stroke:5px var(--text-primary);color:var(--text-primary);paint-order:stroke fill">MEETP<span style="margin-left:-.13em">R</span></span><span style="position:absolute;left:0;top:0;color:var(--bg-base)">MEETP<span style="margin-left:-.13em">R</span></span></span></div>
<div>
<div style="font-family:'Archivo','Noto Sans SC',sans-serif;font-weight:800;font-size:44px;line-height:.96;letter-spacing:-.025em;color:var(--text-primary)">Better than<br>yesterday</div>
<div style="width:44px;height:3px;background:var(--gold-500);margin-top:16px;border-radius:2px"></div>
</div>
</div>
<div style="flex:1"></div>
<div style="display:flex;flex-direction:column;gap:14px;padding-bottom:26px">
<div style="font-size:13px;color:var(--text-tertiary)">用手机号和密码登录。</div>
<div style="background:var(--surface-card);border:1px solid var(--gold-500);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:5px;box-shadow:0 0 0 3px rgba(217,119,6,.10)">
<span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--gold-text)">手机号</span>
<div style="display:flex;align-items:center;gap:10px">
<span style="font-family:'IBM Plex Mono',monospace;font-size:17px;font-weight:500;color:var(--text-tertiary)">+86</span>
<span style="width:1px;height:18px;background:var(--border-strong)"></span>
<span style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:500;letter-spacing:.04em;color:var(--text-primary)">138 0000 0001</span>
<span style="width:1.5px;height:20px;background:var(--gold-500);margin-left:1px"></span>
</div>
</div>
<div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(17,24,39,.04)">
<div style="display:flex;flex-direction:column;gap:5px;flex:1;min-width:0">
<span style="font-family:'IBM Plex Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.14em;color:var(--text-muted)">密码</span>
<span style="font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;letter-spacing:.14em;color:var(--text-primary);line-height:1.1">••••••••</span>
</div>
<span style="display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:9px;background:var(--surface-raised);cursor:pointer" style-hover="background:var(--border-strong)">
<svg width="17" height="17" sc-camel-view-box="0 0 24 24" fill="none" stroke="var(--text-tertiary)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="2.6"></circle></svg>
</span>
</div>
<div style="display:flex;justify-content:flex-end;margin-top:-4px">
<span style="font-size:12.5px;color:var(--text-tertiary);cursor:pointer" style-hover="color:var(--text-primary)">忘记密码？</span>
</div>
<button style="height:54px;border:none;border-radius:14px;background:var(--gold-500);color:var(--ink-on-gold);font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;font-size:16px;font-weight:700;letter-spacing:.02em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 6px 18px rgba(217,119,6,.22)" style-hover="background:var(--gold-400)" style-active="transform:scale(.985)">
登录
<svg width="16" height="16" sc-camel-view-box="0 0 24 24" fill="none" stroke="var(--ink-on-gold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 5l7 7-7 7"></path></svg>
</button>
<div style="text-align:center;font-size:12px;line-height:1.55;color:var(--text-muted)">继续即表示同意 <span style="color:var(--gold-text);border-bottom:1px solid var(--gold-text);cursor:pointer">服务条款</span> 与 <span style="color:var(--gold-text);border-bottom:1px solid var(--gold-text);cursor:pointer">隐私政策</span></div>
<div style="align-self:center;width:120px;height:4px;border-radius:2px;background:var(--border-strong);margin-top:2px"></div>
</div>
</div>
</div>
</div>
</body></html>
