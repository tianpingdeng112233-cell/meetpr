<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./dc-tokens.css">
<style>html,body{margin:0;padding:0}</style>
</helmet>
<div style="{{ rootStyle }}">
<span style="{{ labelStyle }}">{{ label }}</span>
<span style="display:flex;align-items:baseline;gap:5px">
<span style="{{ valueStyle }}">{{ value }}</span>
<span style="{{ unitStyle }}">{{ unit }}</span>
</span>
<span style="{{ deltaStyle }}">{{ delta }}</span>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:180,&quot;height&quot;:110},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;体重&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;83&quot;,&quot;tsType&quot;:&quot;string | number&quot;},&quot;unit&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;kg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;delta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;neutral&quot;,&quot;gold&quot;,&quot;success&quot;,&quot;danger&quot;],&quot;default&quot;:&quot;neutral&quot;,&quot;tsType&quot;:&quot;'neutral'|'gold'|'success'|'danger'&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p = this.props;
    const accent = p.accent || 'neutral';
    const d = p.delta || '';
    // the sign carries gain/loss on its own — no arrow glyphs
    const deltaColor = d.startsWith('-') ? 'var(--danger)' : d.startsWith('+') ? 'var(--success)' : 'var(--text-muted)';
    const valueColor = accent === 'gold' ? 'var(--gold-500)'
      : accent === 'success' ? 'var(--success)'
      : accent === 'danger' ? 'var(--danger)' : 'var(--text-primary)';

    return {
      label: p.label ?? '体重',
      value: p.value ?? '83',
      unit: p.unit ?? 'kg',
      delta: d,
      rootStyle: `display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:16px;background:var(--surface-card);box-shadow:var(--card-shadow);font-family:'Noto Sans SC',sans-serif`,
      labelStyle: `font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:11px;letter-spacing:.06em;color:var(--text-muted)`,
      valueStyle: `font-family:'IBM Plex Mono',monospace;font-size:28px;font-weight:800;line-height:1;color:${valueColor}`,
      unitStyle: `font-size:12px;font-weight:500;color:var(--text-muted)`,
      deltaStyle: d ? `font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;color:${deltaColor}` : 'display:none'
    };
  }
}
</script>
</body>
</html>
