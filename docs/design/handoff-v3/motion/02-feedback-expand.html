<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 · 教练反馈卡展开/收起</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../motion.css">
<style>
body{margin:0;background:var(--bg-deep);color:var(--text-primary);font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
.note{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:12px;color:var(--text-muted);max-width:390px;line-height:1.7}
.stagewrap{width:390px;padding:20px 20px 40px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:24px;box-sizing:border-box}
</style>
</head>
<body>
<button onclick="document.body.classList.toggle('theme-light')" style="position:fixed;top:12px;right:12px;z-index:99;border:1px solid var(--border-strong);background:var(--surface-card);color:var(--text-secondary);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono','Noto Sans SC',monospace;box-shadow:var(--card-shadow)">暗色 / 亮色</button>
<div class="note">反馈卡展开：预览 50ms 淡出 → 切 DOM → 容器 height 380ms easeOutCubic + p&gt;.62 后 3px 正弦 overshoot；4 条明细 20+i×30ms 错峰、200ms translateY(-8→0)；箭头 260ms 转 180°。收起：280ms，预览延迟 90ms 淡回。收起态背后两层堆叠底衬是静态定位元素，不参与动画。DOM 与样式逐字取自样机。</div>
<div class="stagewrap"><div id="wrap" style="position:relative;margin-bottom:8px"></div></div>
<script>
const wrap=document.getElementById('wrap');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tween(dur,step,done){const t0=performance.now();const run=()=>{const p=Math.min(1,(performance.now()-t0)/dur);step(p);if(p<1)requestAnimationFrame(run);else if(done)done();};requestAnimationFrame(run);}
const FB=[
  {label:'深蹲 · 第 1 组',text:'深蹲第一组速度很好，下一次保持同样节奏，最后一组不要急着起杠。',unread:true},
  {label:'深蹲 · 第 3 组',text:'第三组有点塌腰，注意先收紧背部再下蹲。',unread:true},
  {label:'硬拉 · 第 2 组',text:'硬拉锁定很稳，起始阶段可以再快一点发力。',unread:true},
  {label:'卧推 · 第 2 组',text:'卧推落杠位置偏高，收紧上背，触胸再稳一点。',unread:false}
];
const unread=FB.filter(f=>f.unread).length;
const chev=(c)=>`<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>`;
const badge=`<span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;background:var(--gold-text);color:var(--ink-on-gold);padding:1px 6px;border-radius:999px">${unread} 条未读</span>`;
let expanded=false;
function render(){
  if(!expanded){
    wrap.innerHTML=`
    <div style="position:absolute;left:14px;right:14px;top:11px;bottom:-11px;background:var(--bg-inset);border:1px solid var(--surface-key);border-radius:12px"></div>
    <div style="position:absolute;left:7px;right:7px;top:5px;bottom:-5px;background:var(--bg-stack);border:1px solid var(--surface-key);border-radius:12px"></div>
    <div class="pb" data-toggle style="position:relative;background:var(--surface-card);border-left:3px solid var(--gold-500);border-radius:12px;padding:14px 16px;cursor:pointer">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px"><span style="width:7px;height:7px;border-radius:50%;background:var(--gold-500)"></span><span style="font-size:13px;font-weight:700">教练反馈</span>${badge}<span style="font-size:12px;color:var(--text-faint)">· 周日</span></div>
      <div data-fbpreview style="font-size:14px;line-height:1.55;color:var(--text-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${FB[0].text}</div>
      <div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);margin-top:9px">展开全部 ${FB.length} 条反馈${chev('var(--text-muted)')}</div>
    </div>`;
  } else {
    wrap.innerHTML=`
    <div style="background:var(--surface-card);border-left:3px solid var(--gold-500);border-radius:12px;padding:13px 15px 4px">
      <div class="pb" data-toggle style="display:flex;align-items:center;gap:7px;margin-bottom:6px;cursor:pointer"><span style="width:7px;height:7px;border-radius:50%;background:var(--gold-500)"></span><span style="font-size:13px;font-weight:700">教练反馈</span>${badge}<span style="margin-left:auto;display:flex;align-items:center;gap:3px;font-size:12px;color:var(--text-muted)">收起<span data-fbarrow style="display:flex;transform:rotate(180deg)">${chev('var(--text-muted)')}</span></span></div>
      ${FB.map(f=>`<div class="pb" data-fbitem style="border-top:1px solid var(--border-subtle);padding:10px 0;cursor:pointer">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:3px"><span style="font-size:13px;font-weight:600;color:var(--text-secondary)">${f.label}</span>${f.unread?'<span style="width:6px;height:6px;border-radius:50%;background:var(--gold-500)"></span>':''}<span style="margin-left:auto;display:flex;align-items:center;gap:2px;font-size:11px;color:var(--text-muted)">查看<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg></span></div>
        <div style="font-size:13px;line-height:1.45;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${f.text}</div>
      </div>`).join('')}
    </div>`;
  }
  wrap.querySelector('[data-toggle]').addEventListener('click',toggleFb);
}
function toggleFb(){
  if(reduced){ expanded=!expanded; render(); return; }
  const expanding=!expanded;
  const h0=wrap.getBoundingClientRect().height;
  const preview=wrap.querySelector('[data-fbpreview]');
  const doSwitch=()=>{
    expanded=expanding; render();
    const h1=wrap.getBoundingClientRect().height;
    wrap.style.height=h0+'px'; wrap.style.overflow='hidden';
    if(expanding){
      const items=[...wrap.querySelectorAll('[data-fbitem]')];
      items.forEach(c=>{c.style.opacity='0';});
      items.forEach((c,i)=>{setTimeout(()=>{tween(200,(p)=>{const e=1-Math.pow(1-p,3);c.style.opacity=String(e);c.style.transform=`translateY(${(-8*(1-e)).toFixed(1)}px)`;},()=>{c.style.opacity='';c.style.transform='';});},20+i*30);});
      const arrow=wrap.querySelector('[data-fbarrow]');
      if(arrow){arrow.style.transform='rotate(0deg)';tween(260,(p)=>{const e=1-Math.pow(1-p,3);arrow.style.transform=`rotate(${(180*e).toFixed(0)}deg)`;});}
      tween(380,(p)=>{const e=1-Math.pow(1-p,3);const os=p>0.62?3*Math.sin((p-0.62)/0.38*Math.PI):0;wrap.style.height=(h0+(h1-h0)*e+os).toFixed(1)+'px';},()=>{wrap.style.height='';wrap.style.overflow='';});
    } else {
      const pv=wrap.querySelector('[data-fbpreview]');
      if(pv){pv.style.opacity='0';setTimeout(()=>{tween(180,(p)=>{pv.style.opacity=String(p);},()=>{pv.style.opacity='';});},90);}
      tween(280,(p)=>{const e=1-Math.pow(1-p,3);wrap.style.height=(h0+(h1-h0)*e).toFixed(1)+'px';},()=>{wrap.style.height='';wrap.style.overflow='';});
    }
  };
  if(expanding && preview) tween(50,(p)=>{preview.style.opacity=String(1-p);},doSwitch);
  else doSwitch();
}
render();
</script>
</body>
</html>
