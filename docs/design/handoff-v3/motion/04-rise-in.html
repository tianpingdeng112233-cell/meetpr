<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 · 错峰上浮进场（riseIn）</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../motion.css">
<style>
body{margin:0;background:var(--bg-deep);color:var(--text-primary);font-family:'IBM Plex Sans','Noto Sans SC',sans-serif;display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px}
.note{font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:12px;color:var(--text-muted);max-width:390px;line-height:1.7}
.btnrow{display:flex;gap:8px;width:390px}
.btnrow button{flex:1;border:1px solid var(--border-strong);background:transparent;color:var(--text-secondary);border-radius:999px;padding:11px;font-size:13px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<button onclick="document.body.classList.toggle('theme-light')" style="position:fixed;top:12px;right:12px;z-index:99;border:1px solid var(--border-strong);background:var(--surface-card);color:var(--text-secondary);border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:'IBM Plex Mono','Noto Sans SC',monospace;box-shadow:var(--card-shadow)">暗色 / 亮色</button>
<div class="note">进场错峰上浮 riseIn：容器的每个直接子元素 500ms tween（easeOutCubic），translateY 72px→0 + scaleY .88→1，同时淡入；起始延迟 base + i×step，结束后清空内联样式。今日页进场 base=20 / step=40ms；「开始第一组」后的动作卡列表 base=360 / step=90ms（等 hero 过渡完再浮现）。sticky 摘要条 pillIn：340ms translateY(-9→0) + scaleY(.62→1)。DOM 与样式逐字取自样机。</div>
<div class="btnrow"><button id="b1">今日页 · base 20 / step 40</button><button id="b2">动作卡列表 · base 360 / step 90</button><button id="b3">pillIn 摘要条</button></div>
<div style="width:390px;height:700px;background:var(--bg-base);border:1px solid var(--border-subtle);border-radius:24px;overflow:hidden;box-sizing:border-box">
  <div id="stage" style="padding:20px 20px 28px;display:flex;flex-direction:column;gap:15px"></div>
</div>
<script>
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tween(dur,step,done){const t0=performance.now();const run=()=>{const p=Math.min(1,(performance.now()-t0)/dur);step(p);if(p<1)requestAnimationFrame(run);else if(done)done();};requestAnimationFrame(run);}
// 逐字对应样机 riseIn(el, base, step)
function riseIn(el,base,step){
  if(reduced) return;
  if(base===undefined)base=20; if(step===undefined)step=40;
  [...el.children].forEach((c,i)=>{
    c.style.opacity='0';
    setTimeout(()=>{
      tween(500,(p)=>{const e=1-Math.pow(1-p,3);c.style.opacity=String(e);c.style.transform=`translateY(${(72*(1-e)).toFixed(1)}px) scaleY(${(0.88+0.12*e).toFixed(3)})`;},()=>{c.style.opacity='';c.style.transform='';});
    },base+i*step);
  });
}
const stage=document.getElementById('stage');
const logo=(sz)=>`<span style="position:relative;display:inline-block;font-family:'Archivo',sans-serif;font-weight:900;font-size:${sz}px;letter-spacing:-.11em;line-height:1"><span style="-webkit-text-stroke:5px var(--text-primary);color:var(--text-primary);paint-order:stroke fill">MEETP<span style="margin-left:-.13em">R</span></span><span style="position:absolute;left:0;top:0;color:var(--bg-base)">MEETP<span style="margin-left:-.13em">R</span></span></span>`;
// 今日页顶部（1:1）
function todayScreen(){
  stage.innerHTML=`
  <div style="display:flex;align-items:center;gap:10px">${logo(16)}<span style="font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:12px;letter-spacing:.06em;color:var(--text-muted)">7月24日 · 星期五</span></div>
  <div style="display:flex;align-items:flex-start;justify-content:space-between">
    <div style="font-family:'Archivo','Noto Sans SC',sans-serif;font-weight:800;font-size:54px;line-height:.9;color:var(--text-primary);text-shadow:var(--headline-emboss)">W1D4</div>
    <div class="pb" style="position:relative;width:44px;height:44px;border-radius:50%;background:var(--surface-card);display:flex;align-items:center;justify-content:center;cursor:pointer"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"></path></svg><span style="position:absolute;top:-1px;right:-1px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--danger-fill);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace">3</span></div>
  </div>
  <div style="display:flex;gap:5px;margin-top:-8px">
    <span style="flex:1;height:4px;border-radius:2px;background:var(--text-primary)"></span>
    <span style="flex:1;height:4px;border-radius:2px;background:var(--text-primary)"></span>
    <span style="flex:1;height:4px;border-radius:2px;background:var(--text-primary)"></span>
    <span style="flex:1.5;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--gold-500),var(--gold-400),#FFD470);box-shadow:0 0 7px rgba(var(--gold-rgb),.75)"></span>
  </div>
  <div style="position:relative;margin-bottom:8px">
    <div style="position:absolute;left:14px;right:14px;top:11px;bottom:-11px;background:var(--bg-inset);border:1px solid var(--surface-key);border-radius:12px"></div>
    <div style="position:absolute;left:7px;right:7px;top:5px;bottom:-5px;background:var(--bg-stack);border:1px solid var(--surface-key);border-radius:12px"></div>
    <div class="pb" style="position:relative;background:var(--surface-card);border-left:3px solid var(--gold-500);border-radius:12px;padding:14px 16px;cursor:pointer">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px"><span style="width:7px;height:7px;border-radius:50%;background:var(--gold-500)"></span><span style="font-size:13px;font-weight:700">教练反馈</span><span style="font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:700;background:var(--gold-text);color:var(--ink-on-gold);padding:1px 6px;border-radius:999px">3 条未读</span><span style="font-size:12px;color:var(--text-faint)">· 周日</span></div>
      <div style="font-size:14px;line-height:1.55;color:var(--text-primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">深蹲第一组速度很好，下一次保持同样节奏，最后一组不要急着起杠。</div>
      <div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-muted);margin-top:9px">展开全部 4 条反馈<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></div>
    </div>
  </div>
  <div style="display:flex;gap:11px;margin-top:2px">
    <div style="flex:1;background:var(--surface-card);border-radius:16px;padding:14px 16px"><div style="display:flex;align-items:center;gap:6px;color:var(--text-primary);font-size:11px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-primary)" stroke-width="2"><path d="M12 3v6M7 21h10a2 2 0 002-2 7 7 0 00-14 0 2 2 0 002 2z"></path></svg>体重</div><div style="font-size:24px;font-weight:800;font-family:'Archivo',sans-serif;margin-top:3px">83<span style="font-size:13px;color:var(--text-muted);font-weight:600"> kg</span></div></div>
    <div style="flex:1;position:relative;background:linear-gradient(155deg,rgba(var(--gold-rgb),.13),var(--surface-card) 62%);box-shadow:inset 0 0 0 1px rgba(var(--gold-rgb),.3);border-radius:16px;padding:14px 16px"><div style="display:flex;align-items:center;gap:6px;color:var(--text-primary);font-size:11px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--gold-500)" stroke-width="2" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"></path></svg>距比赛</div><div style="display:flex;align-items:center;gap:5px;margin-top:3px"><svg width="14" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--gold-500)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg><span style="font-size:24px;font-weight:800;font-family:'Archivo',sans-serif;color:var(--gold-text);line-height:1;text-shadow:0 0 14px rgba(var(--gold-rgb),.45)">3</span><span style="font-size:13px;color:var(--text-muted);font-weight:600"> 天</span></div></div>
  </div>`;
}
// 训练页动作卡列表（1:1，pending 态）
const EXS=[
  {name:'硬拉',meta:'上次 170kg×3 @8 · 最佳 175kg×3 @8.5',stat:'0 / 3 组已记录',sets:[[175,3,8.5],[175,3,8.5],[175,3,8.5]],note:'注意启动时股四的蹬地'},
  {name:'低杠位深蹲',meta:'上次 125kg×4 @6 · 最佳 125kg×4 @6',stat:'0 / 3 组已记录',sets:[[125,4,6],[125,4,6],[125,4,6]],note:'控速下蹲，膝盖不要内扣'},
  {name:'节奏卧推',meta:'上次 87.5kg×2 @6 · 最佳 90kg×2 @6',stat:'0 / 1 组已记录',sets:[[90,2,6]],note:'节奏 3-1-0，触胸稳一点'}
];
const pend='<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--text-ghost)" stroke-width="2.4"></circle></svg>';
const camDim='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="12.5" height="10" rx="2.5"></rect><path d="M15 10.5l6-3v9l-6-3z"></path></svg>';
function exCard(e){
  return `<div style="overflow:hidden"><div class="pb" style="transform-origin:50% 0;border-radius:16px;overflow:hidden;background:var(--surface-card);box-shadow:var(--card-shadow);align-self:center;width:100%">
  <div style="display:flex;align-items:center;gap:11px;min-height:44px;padding:12px 16px;cursor:pointer">
    <span style="width:3px;align-self:stretch;min-height:26px;border-radius:2px;flex:none;background:var(--gold-500)"></span>
    <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
      <span style="font-family:'Archivo','Noto Sans SC',sans-serif;font-weight:800;font-size:16px;color:var(--text-primary)">${e.name}</span>
      <span style="font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:11px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.meta}</span>
    </span>
    <span style="font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:12px;font-weight:600;color:var(--text-dim);flex:none">${e.stat}</span>
    <span style="color:var(--text-muted);font-size:11px;flex:none">▾</span>
  </div>
  <div style="display:grid;grid-template-columns:22px 1fr 1fr 1fr 64px;padding:6px 14px;border-top:1px solid var(--border-hairline);font-family:'IBM Plex Mono','Noto Sans SC',monospace;font-size:10px;letter-spacing:.05em;color:var(--text-dim)"><span>#</span><span>重量</span><span style="text-align:center">次数</span><span style="text-align:center">RPE</span><span></span></div>
  ${e.sets.map((s,i)=>`<div style="display:grid;grid-template-columns:22px 1fr 1fr 1fr 64px;align-items:center;min-height:44px;padding:0 14px;border-bottom:1px solid var(--border-hairline);font-family:'IBM Plex Mono','Noto Sans SC',monospace;color:var(--text-dim)"><span style="font-size:13px;font-weight:700">${i+1}</span><span style="font-size:15px;font-weight:700">${s[0]}</span><span style="text-align:center;font-size:14px">${s[1]}</span><span style="text-align:center;font-size:14px">${s[2]}</span><span style="display:flex;justify-content:flex-end;align-items:center;gap:11px">${pend}${camDim}</span></div>`).join('')}
  <div style="padding:11px 16px;font-size:12px;line-height:1.6;color:var(--text-secondary)">${e.note}</div>
  </div></div>`;
}
function trainList(){
  stage.innerHTML=`<div id="pill" style="display:none;position:sticky;top:6px;z-index:5;align-items:center;gap:9px;background:var(--surface-card);border:1px solid var(--surface-key);border-radius:12px;padding:11px 14px;box-shadow:0 6px 16px rgba(0,0,0,.35)"><span style="font-size:13px;color:var(--text-primary);font-family:'IBM Plex Mono','Noto Sans SC',monospace">七月24日 · 星期五</span><span style="margin-left:auto;font-size:11px;color:var(--text-dim);display:flex;align-items:center;gap:3px">上滑到顶展开<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--text-dim)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"></path></svg></span></div>`
    +EXS.map(exCard).join('');
  stage.style.gap='13px';
}
document.getElementById('b1').onclick=()=>{stage.style.gap='15px';todayScreen();riseIn(stage);};
document.getElementById('b2').onclick=()=>{trainList();riseIn(stage,360,90);
  // 首个子元素是隐藏的 pill，样机中列表 riseIn 只作用于卡片；demo 简化为一起处理
};
document.getElementById('b3').onclick=()=>{
  if(!document.getElementById('pill')) trainList();
  const pill=document.getElementById('pill');
  pill.style.display='flex';
  if(reduced)return;
  // 逐字对应样机 pillInRef：340ms 展开
  tween(340,(p)=>{const e=1-Math.pow(1-p,3);pill.style.opacity=String(e);pill.style.transform=`translateY(${(-9*(1-e)).toFixed(1)}px) scaleY(${(0.62+0.38*e).toFixed(3)})`;},()=>{pill.style.opacity='';pill.style.transform='';});
};
todayScreen(); riseIn(stage);
</script>
</body>
</html>
