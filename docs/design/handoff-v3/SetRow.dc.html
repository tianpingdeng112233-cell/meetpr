<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./dc-tokens.css">
<style>html,body{margin:0;padding:0}</style>
</helmet>
<div role="row" style="{{ rootStyle }}">
<span role="cell" style="{{ noStyle }}">{{ index }}</span>
<span role="cell" style="{{ numStyle }}">{{ weight }}</span>
<span role="cell" style="{{ midStyle }}">{{ reps }}</span>
<span role="cell" style="{{ midStyle }}">{{ rpe }}</span>
<span role="cell" style="display:flex;justify-content:flex-end;align-items:center;gap:11px">
<span role="img" aria-label="{{ statusLabel }}" style="display:flex">
<sc-if value="{{ isDone }}" hint-placeholder-val="{{ true }}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
</sc-if>
<sc-if value="{{ isFailed }}" hint-placeholder-val="{{ false }}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2.6" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
</sc-if>
<sc-if value="{{ isPending }}" hint-placeholder-val="{{ false }}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="var(--text-ghost)" stroke-width="2.4"></circle></svg>
</sc-if>
</span>
<span role="img" aria-label="{{ videoLabel }}" style="{{ videoWrapStyle }}">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{ videoColor }}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="7" width="12.5" height="10" rx="2.5"></rect><path d="M15 10.5l6-3v9l-6-3z"></path></svg>
</span>
</span>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:48},&quot;index&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;min&quot;:1,&quot;max&quot;:10,&quot;tsType&quot;:&quot;number&quot;},&quot;weight&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:175,&quot;step&quot;:2.5,&quot;unit&quot;:&quot;kg&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;reps&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:3,&quot;min&quot;:1,&quot;max&quot;:30,&quot;tsType&quot;:&quot;number&quot;},&quot;rpe&quot;:{&quot;editor&quot;:&quot;float&quot;,&quot;default&quot;:8.5,&quot;min&quot;:5,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;tsType&quot;:&quot;number&quot;},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pending&quot;,&quot;done&quot;,&quot;failed&quot;],&quot;default&quot;:&quot;done&quot;,&quot;tsType&quot;:&quot;'pending'|'done'|'failed'&quot;},&quot;videoState&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;uploading&quot;,&quot;uploaded&quot;,&quot;failed&quot;],&quot;default&quot;:&quot;uploaded&quot;,&quot;tsType&quot;:&quot;'none'|'uploading'|'uploaded'|'failed'&quot;}}">
class Component extends DCLogic {
  renderVals(){
    const p = this.props;
    const status = p.status || 'pending';
    const vid = p.videoState || 'none';
    const done = status === 'done', failed = status === 'failed';

    // failed sets read in a muted red; unrecorded ones drop the whole row to text-dim
    const ink = failed ? 'var(--danger-muted)' : done ? 'var(--text-primary)' : 'var(--text-dim)';

    return {
      index: p.index ?? 1,
      weight: p.weight ?? 175,
      reps: p.reps ?? 3,
      rpe: (p.rpe ?? 8.5).toFixed ? (p.rpe ?? 8.5).toFixed(1) : p.rpe,
      isDone: done, isFailed: failed, isPending: !done && !failed,
      statusLabel: failed ? '本组失败' : done ? '本组完成' : '尚未记录',
      videoColor: vid === 'uploaded' ? 'var(--success)'
        : vid === 'failed' ? 'var(--danger)'
        : vid === 'uploading' ? 'var(--text-muted)' : 'var(--text-ghost)',
      videoWrapStyle: `display:flex;opacity:${vid === 'uploading' ? '.55' : '1'}`,
      videoLabel: ({none:'无视频',uploading:'视频上传中',uploaded:'视频已上传',failed:'视频上传失败'})[vid],
      rootStyle: `display:grid;grid-template-columns:22px 1fr 1fr 1fr 64px;align-items:center;min-height:44px;padding:0 14px;border-bottom:1px solid var(--border-hairline);font-family:'IBM Plex Mono','Noto Sans SC',monospace`,
      noStyle: `font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:700;color:${done || failed ? 'var(--text-muted)' : 'var(--text-dim)'}`,
      numStyle: `font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:700;color:${ink}`,
      midStyle: `text-align:center;font-family:'IBM Plex Mono',monospace;font-size:14px;color:${ink}`
    };
  }
}
</script>
</body>
</html>
