included:
  - Sources
  - Tests

excluded:
  - .build
  - .swiftpm
  - .swiftlint-cache
  - DerivedData

allow_zero_lintable_files: true
cache_path: .swiftlint-cache
reporter: xcode

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

opt_in_rules:
  - empty_count
  - redundant_nil_coalescing
  - sorted_imports

analyzer_rules:
  - unused_declaration
  - unused_import

identifier_name:
  excluded:
    - id
    - x
    - y
    - URL
