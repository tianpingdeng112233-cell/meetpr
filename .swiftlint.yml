included:
  - MeetPR
  - MeetPRTests
  - Modules

excluded:
  - .build
  - Modules/**/.build
  - .swiftpm
  - Modules/**/.swiftpm
  - .swiftlint-cache
  - DerivedData

allow_zero_lintable_files: true
cache_path: .swiftlint-cache
reporter: xcode

disabled_rules:
  - trailing_comma
  # opening_brace conflicts with swift-format on multi-line declarations
  # (swift-format keeps `{` on its own line); defer to swift-format, same as trailing_comma.
  - opening_brace

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

# Thresholds set to the current baseline so CI `--strict` (warnings→errors) passes on
# long-standing large files. file_length stays 600 to cover ProgressionRuleEditorCard
# (454 now, ~536 with the in-flight progression-rule fix); split it + ratchet down post-V0.
file_length:
  warning: 600
  error: 1200

type_body_length:
  warning: 300
  error: 500

function_body_length:
  warning: 60
  error: 120

opt_in_rules:
  - empty_count
  - redundant_nil_coalescing
  - sorted_imports

analyzer_rules:
  - unused_declaration
  - unused_import

identifier_name:
  excluded:
    - id
    - x
    - y
    - URL
