included:
  - MeetPR
  - MeetPRTests
  - Modules

excluded:
  - .build
  - Modules/**/.build
  - .swiftpm
  - Modules/**/.swiftpm
  - .swiftlint-cache
  - DerivedData

allow_zero_lintable_files: true
cache_path: .swiftlint-cache
reporter: xcode

disabled_rules:
  - trailing_comma
  # brace 位置由 swift-format --strict 主管(多行声明后 { 单独成行);
  # swiftlint opening_brace 与之互斥,禁用以消除两 formatter 冲突
  - opening_brace

line_length:
  warning: 100
  error: 120
  ignores_comments: true
  ignores_urls: true
  ignores_function_declarations: true

opt_in_rules:
  - empty_count
  - redundant_nil_coalescing
  - sorted_imports

analyzer_rules:
  - unused_declaration
  - unused_import

identifier_name:
  excluded:
    - id
    - x
    - y
    - URL
