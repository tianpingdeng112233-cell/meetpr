<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MeetPR — iOS UI Kit</title>
<link rel="stylesheet" href="screens.css"/>
<style>
  body { margin: 0; background: #0A0A0A; }
  .canvas-bg { background: #0A0A0A; min-height: 100vh; padding: 48px 32px; }
  .header { color: #fff; font-family: -apple-system, sans-serif; max-width: 1400px; margin: 0 auto 32px; }
  .header .eyebrow { font-family: ui-monospace, "SF Mono", monospace; font-size: 11px; color: #E5221E; letter-spacing: 0.08em; text-transform: uppercase; }
  .header h1 { font-size: 36px; font-weight: 800; margin: 6px 0 4px; letter-spacing: -0.02em; }
  .header p { color: #B5B5B5; font-size: 14px; max-width: 640px; line-height: 1.5; margin: 0; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 32px;
    max-width: 1800px;
    margin: 0 auto;
  }
  .frame-wrap {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .frame-label {
    font-family: ui-monospace, "SF Mono", monospace;
    font-size: 11px; color: #737373; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .frame-label .num { color: #E5221E; }
  .phone {
    width: 320px; height: 692px;
    background: #000;
    border-radius: 44px;
    border: 8px solid #1a1a1a;
    overflow: hidden;
    position: relative;
    box-shadow: 0 24px 64px rgba(0,0,0,0.6);
  }
  .phone::before {
    content: ""; position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 32px; background: #000; border-radius: 20px; z-index: 10;
  }
  .phone-screen { width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="canvas-bg">
  <div class="header">
    <div class="eyebrow">UI KIT — IOS · DARK FIRST ────</div>
    <h1>MeetPR — Composed Screens</h1>
    <p>Five hi-fi screens demonstrating the design system in context: coach dashboard, planning editor, student training day, plan view, and auth flow.</p>
  </div>
  <div class="grid" id="root"></div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="screens-1.jsx"></script>
<script type="text/babel" src="screens-2.jsx"></script>
<script type="text/babel">
const { CoachDashboard, PlanningEditor } = window.Screens1;
const { StudentTrainingDay, StudentPlanView, AuthFlow } = window.Screens2;

const SCREENS = [
  { num: "01", label: "AUTH · ACCESS", screen: <AuthFlow/>, "data-screen-label": "01 Auth" },
  { num: "02", label: "COACH · DASHBOARD", screen: <CoachDashboard/>, "data-screen-label": "02 Coach Dashboard" },
  { num: "03", label: "COACH · PLANNING EDITOR", screen: <PlanningEditor/>, "data-screen-label": "03 Planning Editor" },
  { num: "04", label: "STUDENT · TRAINING DAY", screen: <StudentTrainingDay/>, "data-screen-label": "04 Training Day" },
  { num: "05", label: "STUDENT · PLAN VIEW", screen: <StudentPlanView/>, "data-screen-label": "05 Plan View" },
];

const App = () => (
  <>
    {SCREENS.map((s) => (
      <div key={s.num} className="frame-wrap" data-screen-label={s["data-screen-label"]}>
        <div className="frame-label"><span className="num">{s.num}</span> ─── {s.label}</div>
        <div className="phone"><div className="phone-screen">{s.screen}</div></div>
      </div>
    ))}
  </>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
