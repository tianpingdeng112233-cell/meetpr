<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">Card anatomy — padding · radius · border · hit target</div>
  <div style="background:#0E0E0E;border:1px solid #262626;border-radius:12px;padding:16px;position:relative;">
    <!-- padding indicators -->
    <div style="position:absolute;top:0;left:0;right:0;height:16px;background:repeating-linear-gradient(45deg,rgba(229,34,30,0.15) 0 4px,transparent 4px 8px);"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:16px;background:repeating-linear-gradient(45deg,rgba(229,34,30,0.15) 0 4px,transparent 4px 8px);"></div>
    <div style="position:absolute;top:0;bottom:0;left:0;width:16px;background:repeating-linear-gradient(45deg,rgba(229,34,30,0.15) 0 4px,transparent 4px 8px);"></div>
    <div style="position:absolute;top:0;bottom:0;right:0;width:16px;background:repeating-linear-gradient(45deg,rgba(229,34,30,0.15) 0 4px,transparent 4px 8px);"></div>
    <div style="font-family:var(--font-mono);font-size:10px;color:#E5221E;letter-spacing:0.08em;text-transform:uppercase;">SQUAT W3D1</div>
    <div style="color:#fff;font-size:20px;font-weight:600;margin-top:6px;">Top Set + 3 Backoff</div>
    <div style="color:#B5B5B5;font-size:13px;margin-top:6px;">4 sets · ~28 min</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font-family:var(--font-mono);font-size:10px;color:#737373;letter-spacing:0.06em;text-transform:uppercase;line-height:1.4;">
    <div><span style="color:#E5221E;">PADDING</span><br>16 all sides</div>
    <div><span style="color:#E5221E;">RADIUS</span><br>12pt (lg)</div>
    <div><span style="color:#E5221E;">BORDER</span><br>1px #262626</div>
    <div><span style="color:#E5221E;">HIT TARGET</span><br>≥ 44pt</div>
  </div>
</div></body></html>
