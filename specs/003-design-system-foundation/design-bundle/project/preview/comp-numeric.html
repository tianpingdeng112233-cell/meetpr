<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">Numeric input — kg/lb with quick adjust</div>
  <div style="background:#0E0E0E;border:1px solid #262626;border-radius:12px;padding:16px;display:flex;align-items:center;gap:12px;">
    <button style="width:44px;height:44px;border-radius:8px;background:#161616;border:1px solid #262626;color:#fff;font-size:20px;font-family:var(--font-mono);">−</button>
    <div style="flex:1;text-align:center;">
      <span class="t-display-numeral" style="color:#fff;font-size:48px;">142.5</span>
      <span class="t-display-unit" style="font-size:18px;margin-left:8px;">KG</span>
    </div>
    <button style="width:44px;height:44px;border-radius:8px;background:#161616;border:1px solid #262626;color:#fff;font-size:20px;font-family:var(--font-mono);">+</button>
  </div>
  <div style="display:flex;gap:8px;">
    <button style="flex:1;padding:8px;background:#161616;border:1px solid #262626;border-radius:8px;color:#fff;font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;">−2.5</button>
    <button style="flex:1;padding:8px;background:#161616;border:1px solid #262626;border-radius:8px;color:#fff;font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;">−5</button>
    <button style="flex:1;padding:8px;background:#161616;border:1px solid #262626;border-radius:8px;color:#fff;font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;">+2.5</button>
    <button style="flex:1;padding:8px;background:#161616;border:1px solid #262626;border-radius:8px;color:#fff;font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;">+5</button>
    <div style="flex:1;padding:8px;background:#fff;color:#000;border-radius:8px;text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;font-weight:600;">KG ⇄ LB</div>
  </div>
</div></body></html>
