<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">Brand — the signal</div>
  <div class="spread">
    <div class="swatch" style="background:#E5221E;color:#fff;border-color:rgba(255,255,255,0.12);min-height:120px;"><span class="label">brand red</span><span class="hex">#E5221E</span></div>
    <div class="swatch" style="background:#B81A17;color:#fff;border-color:rgba(255,255,255,0.12);min-height:120px;"><span class="label">red pressed</span><span class="hex">#B81A17</span></div>
    <div class="swatch" style="background:rgba(229,34,30,0.12);color:#E5221E;border:1px solid rgba(229,34,30,0.3);min-height:120px;"><span class="label">red soft</span><span class="hex">12% alpha</span></div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:#737373;line-height:1.6;">
    Used for: PR badges • AI moments • eyebrow labels • active tab • danger.<br/>
    Rule: ≤ 2–3 red marks per screen. Red <em style="color:#E5221E;font-style:normal;">is</em> the danger color — no separate alert red.
  </div>
</div></body></html>
