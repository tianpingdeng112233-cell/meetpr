<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">Tab bar — coach (5 items)</div>
  <div style="background:#0E0E0E;border-top:1px solid #262626;display:flex;padding:8px 0 12px;">
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;position:relative;">
      <div style="width:24px;height:24px;border:1.75px solid currentColor;border-radius:4px;"></div>
      <span style="font-family:var(--font-sans);font-size:10px;font-weight:600;">Today</span>
      <div style="position:absolute;top:-8px;left:25%;right:25%;height:2px;background:#E5221E;"></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#737373;">
      <div style="width:24px;height:24px;border:1.75px solid currentColor;border-radius:2px;"></div>
      <span style="font-family:var(--font-sans);font-size:10px;font-weight:500;">Plan</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#737373;">
      <div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:18px;">◉◉</div>
      <span style="font-family:var(--font-sans);font-size:10px;font-weight:500;">Athletes</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#737373;">
      <div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;">▭</div>
      <span style="font-family:var(--font-sans);font-size:10px;font-weight:500;">Inbox</span>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;color:#737373;">
      <div style="width:24px;height:24px;border:1.75px solid currentColor;border-radius:50%;"></div>
      <span style="font-family:var(--font-sans);font-size:10px;font-weight:500;">Profile</span>
    </div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:#737373;letter-spacing:0.06em;text-transform:uppercase;">active = white text + 2px brand-red underline · inactive = #737373</div>
</div></body></html>
