<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">Text fields — default, focused, error</div>
  <div>
    <div style="font-family:var(--font-mono);font-size:10px;color:#737373;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;">PHONE</div>
    <input value="+86 138 0000 0000" style="background:#0E0E0E;color:#fff;border:1px solid #262626;border-radius:8px;padding:12px;width:100%;font-family:var(--font-sans);font-size:17px;box-sizing:border-box;">
  </div>
  <div>
    <div style="font-family:var(--font-mono);font-size:10px;color:#737373;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;">VERIFICATION CODE — focused</div>
    <input value="284913" style="background:#0E0E0E;color:#fff;border:1px solid #fff;border-radius:8px;padding:12px;width:100%;font-family:var(--font-mono);font-size:17px;box-sizing:border-box;letter-spacing:0.4em;">
  </div>
  <div>
    <div style="font-family:var(--font-mono);font-size:10px;color:#E5221E;letter-spacing:0.06em;text-transform:uppercase;margin-bottom:6px;">CODE — error</div>
    <input value="000000" style="background:#0E0E0E;color:#fff;border:1px solid #E5221E;border-radius:8px;padding:12px;width:100%;font-family:var(--font-mono);font-size:17px;box-sizing:border-box;letter-spacing:0.4em;">
    <div style="font-family:var(--font-sans);font-size:13px;color:#E5221E;margin-top:6px;">Code expired. Request a new one.</div>
  </div>
</div></body></html>
