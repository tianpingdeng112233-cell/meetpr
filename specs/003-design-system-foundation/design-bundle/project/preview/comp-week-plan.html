<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">Week progress · plan day cells</div>
  <div style="display:flex;gap:6px;">
    <div style="flex:1;height:6px;background:#1FB358;border-radius:2px;"></div>
    <div style="flex:1;height:6px;background:#1FB358;border-radius:2px;"></div>
    <div style="flex:1;height:6px;background:linear-gradient(to right,#fff 60%, #262626 60%);border-radius:2px;"></div>
    <div style="flex:1;height:6px;background:transparent;border:1px solid #262626;border-radius:2px;"></div>
  </div>
  <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:#737373;letter-spacing:0.08em;">
    <span>W1 ✓</span><span>W2 ✓</span><span>W3 · 60%</span><span>W4</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:8px;">
    <div style="aspect-ratio:1;background:#0E0E0E;border:1px solid #262626;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font-family:var(--font-mono);font-size:10px;color:#737373;">M</span><span style="font-size:14px;font-weight:600;color:#fff;">SQ</span></div>
    <div style="aspect-ratio:1;background:#0E0E0E;border:1px solid #262626;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font-family:var(--font-mono);font-size:10px;color:#737373;">T</span><span style="font-size:14px;color:#737373;">—</span></div>
    <div style="aspect-ratio:1;background:#0E0E0E;border:1px solid #262626;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;position:relative;"><span style="font-family:var(--font-mono);font-size:10px;color:#737373;">W</span><span style="font-size:14px;font-weight:600;color:#fff;">BP</span><div style="position:absolute;top:0;right:0;width:0;height:0;border-top:10px solid #E5221E;border-left:10px solid transparent;"></div></div>
    <div style="aspect-ratio:1;background:#161616;border:1px solid #fff;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font-family:var(--font-mono);font-size:10px;color:#fff;">T</span><span style="font-size:14px;font-weight:600;color:#fff;">DL</span></div>
    <div style="aspect-ratio:1;background:#0E0E0E;border:1px solid #262626;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font-family:var(--font-mono);font-size:10px;color:#737373;">F</span><span style="font-size:14px;color:#737373;">—</span></div>
    <div style="aspect-ratio:1;background:#0E0E0E;border:1px solid #262626;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font-family:var(--font-mono);font-size:10px;color:#737373;">S</span><span style="font-size:14px;font-weight:600;color:#fff;">SQ</span></div>
    <div style="aspect-ratio:1;background:#0E0E0E;border:1px solid #262626;border-radius:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;"><span style="font-family:var(--font-mono);font-size:10px;color:#737373;">S</span><span style="font-size:14px;color:#737373;">—</span></div>
  </div>
</div></body></html>
