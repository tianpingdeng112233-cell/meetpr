<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">StatBlock · EyebrowLabel · loading bar</div>
  <div style="display:flex;gap:24px;align-items:flex-end;">
    <div>
      <div style="font-family:var(--font-mono);font-size:11px;color:#E5221E;letter-spacing:0.08em;text-transform:uppercase;">SQUAT STANDARD</div>
      <div style="display:flex;align-items:flex-end;gap:6px;margin-top:4px;"><span class="t-display-numeral" style="color:#fff;">320</span><span class="t-display-unit">KG</span></div>
    </div>
    <div>
      <div style="font-family:var(--font-mono);font-size:11px;color:#E5221E;letter-spacing:0.08em;text-transform:uppercase;">BENCH</div>
      <div style="display:flex;align-items:flex-end;gap:6px;margin-top:4px;"><span class="t-display-numeral" style="color:#fff;">200</span><span class="t-display-unit">KG</span></div>
    </div>
    <div>
      <div style="font-family:var(--font-mono);font-size:11px;color:#E5221E;letter-spacing:0.08em;text-transform:uppercase;">DEADLIFT</div>
      <div style="display:flex;align-items:flex-end;gap:6px;margin-top:4px;"><span class="t-display-numeral" style="color:#fff;">350</span><span class="t-display-unit">KG</span></div>
    </div>
  </div>
  <div style="font-family:var(--font-mono);color:#E5221E;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;display:flex;align-items:center;gap:8px;">PROTOCOL 01<span style="flex:1;height:1px;background:#E5221E;"></span></div>
  <div>
    <div style="font-family:var(--font-mono);font-size:10px;color:#737373;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;">LOADING — 1px brand-red bar, top of view</div>
    <div style="height:1px;background:#262626;position:relative;overflow:hidden;"><div style="position:absolute;top:0;left:0;width:40%;height:100%;background:#E5221E;animation:l 1.4s infinite linear;"></div></div>
    <style>@keyframes l{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}</style>
  </div>
</div></body></html>
