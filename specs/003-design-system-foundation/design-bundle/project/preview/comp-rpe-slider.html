<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">RPE slider — 5.0 → 10.0 in 0.5 steps</div>
  <div style="background:#0E0E0E;border:1px solid #262626;border-radius:12px;padding:20px;">
    <div style="font-family:var(--font-mono);font-size:10px;color:#E5221E;letter-spacing:0.08em;text-transform:uppercase;">RPE</div>
    <div style="display:flex;align-items:flex-end;gap:8px;margin-bottom:16px;">
      <span class="t-display-numeral" style="color:#fff;font-size:64px;">8.5</span>
      <span style="font-family:var(--font-sans);color:#737373;font-size:14px;padding-bottom:14px;">/ 10</span>
    </div>
    <div style="position:relative;height:40px;">
      <div style="position:absolute;top:18px;left:0;right:0;height:4px;background:#262626;border-radius:2px;"></div>
      <div style="position:absolute;top:18px;left:0;width:70%;height:4px;background:#fff;border-radius:2px;"></div>
      <div style="position:absolute;top:8px;left:calc(70% - 12px);width:24px;height:24px;background:#fff;border-radius:50%;box-shadow:0 0 0 4px rgba(255,255,255,0.08);"></div>
      <div style="position:absolute;top:32px;left:0;right:0;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:10px;color:#737373;">
        <span>5.0</span><span>6.0</span><span>7.0</span><span>8.0</span><span>9.0</span><span>10.0</span>
      </div>
    </div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:#737373;letter-spacing:0.06em;text-transform:uppercase;">haptic light tick on every 0.5 step</div>
</div></body></html>
