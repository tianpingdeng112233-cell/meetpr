<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">Badges — PR, status</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
    <span style="background:#E5221E;color:#fff;padding:5px 10px;border-radius:999px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">NEW PR</span>
    <span style="background:#E5221E;color:#fff;padding:5px 10px;border-radius:999px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;">PR</span>
    <span style="background:rgba(31,179,88,0.14);color:#1FB358;padding:5px 10px;border-radius:999px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border:1px solid rgba(31,179,88,0.3);">READY</span>
    <span style="background:transparent;color:#737373;padding:5px 10px;border-radius:999px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border:1px solid #262626;">PENDING</span>
    <span style="background:rgba(224,168,16,0.14);color:#E0A810;padding:5px 10px;border-radius:999px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border:1px solid rgba(224,168,16,0.3);">OVERDUE</span>
    <span style="background:transparent;color:#fff;padding:5px 10px;border-radius:999px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border:1px solid #fff;">COMPLETED</span>
    <span style="background:rgba(229,34,30,0.12);color:#E5221E;padding:5px 10px;border-radius:999px;font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;border:1px solid rgba(229,34,30,0.3);display:inline-flex;align-items:center;gap:6px;">
      <span style="width:6px;height:6px;background:#E5221E;border-radius:50%;animation:p 1.4s infinite;"></span>LIVE
    </span>
  </div>
  <style>@keyframes p{0%,100%{opacity:1}50%{opacity:0.3}}</style>
</div></body></html>
