<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card light" style="background:#FAFAFA;color:#0A0A0A;">
  <div class="tag" style="color:#A3A3A3;">Light — fallback</div>
  <div class="spread">
    <div class="swatch" style="background:#FAFAFA;color:#0A0A0A;border-color:#E5E5E5;"><span class="label">bg</span><span class="hex">#FAFAFA</span></div>
    <div class="swatch" style="background:#FFF;color:#0A0A0A;border-color:#E5E5E5;"><span class="label">surface 1</span><span class="hex">#FFFFFF</span></div>
    <div class="swatch" style="background:#F4F4F5;color:#0A0A0A;border-color:#E5E5E5;"><span class="label">surface 2</span><span class="hex">#F4F4F5</span></div>
    <div class="swatch" style="background:#E9E9EB;color:#0A0A0A;border-color:#C9C9C9;"><span class="label">surface 3</span><span class="hex">#E9E9EB</span></div>
  </div>
  <div class="spread">
    <div class="swatch" style="background:#E5E5E5;color:#0A0A0A;"><span class="label">border</span><span class="hex">#E5E5E5</span></div>
    <div class="swatch" style="background:#FFF;color:#0A0A0A;border-color:#E5E5E5;"><span class="label" style="color:#0A0A0A;">fg-primary</span><span class="hex">#0A0A0A</span></div>
    <div class="swatch" style="background:#FFF;color:#525252;border-color:#E5E5E5;"><span class="label" style="color:#525252;">fg-secondary</span><span class="hex">#525252</span></div>
    <div class="swatch" style="background:#FFF;color:#A3A3A3;border-color:#E5E5E5;"><span class="label" style="color:#A3A3A3;">fg-tertiary</span><span class="hex">#A3A3A3</span></div>
  </div>
</div></body></html>
