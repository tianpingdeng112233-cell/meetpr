<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">Dark — base & surfaces</div>
  <div class="spread">
    <div class="swatch" style="background:#000;color:#fff;border-color:#262626;"><span class="label">bg</span><span class="hex">#000000</span></div>
    <div class="swatch" style="background:#0E0E0E;color:#fff;"><span class="label">surface 1</span><span class="hex">#0E0E0E</span></div>
    <div class="swatch" style="background:#161616;color:#fff;"><span class="label">surface 2</span><span class="hex">#161616</span></div>
    <div class="swatch" style="background:#1F1F1F;color:#fff;"><span class="label">surface 3</span><span class="hex">#1F1F1F</span></div>
  </div>
  <div class="spread">
    <div class="swatch" style="background:#262626;color:#fff;"><span class="label">border</span><span class="hex">#262626</span></div>
    <div class="swatch" style="background:#3A3A3A;color:#fff;"><span class="label">border-strong</span><span class="hex">#3A3A3A</span></div>
    <div class="swatch" style="background:#000;color:#737373;border-color:#262626;"><span class="label" style="color:#737373;">fg-tertiary</span><span class="hex">#737373</span></div>
    <div class="swatch" style="background:#000;color:#B5B5B5;border-color:#262626;"><span class="label" style="color:#B5B5B5;">fg-secondary</span><span class="hex">#B5B5B5</span></div>
  </div>
</div></body></html>
