<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card">
  <div class="tag">Buttons — primary, secondary, danger, disabled</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <button style="background:#fff;color:#000;border:none;border-radius:12px;padding:14px 24px;font-family:var(--font-sans);font-weight:600;font-size:16px;cursor:pointer;">Save Mesocycle</button>
    <button style="background:transparent;color:#fff;border:1px solid #fff;border-radius:12px;padding:14px 24px;font-family:var(--font-sans);font-weight:600;font-size:16px;cursor:pointer;">Discard</button>
    <button style="background:#E5221E;color:#fff;border:none;border-radius:12px;padding:14px 24px;font-family:var(--font-sans);font-weight:600;font-size:16px;cursor:pointer;">Revoke Access</button>
  </div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;">
    <button style="background:rgba(255,255,255,0.6);color:#000;border:none;border-radius:12px;padding:14px 24px;font-family:var(--font-sans);font-weight:600;font-size:16px;cursor:pointer;">Pressed</button>
    <button style="background:transparent;color:rgba(255,255,255,0.35);border:1px solid rgba(255,255,255,0.35);border-radius:12px;padding:14px 24px;font-family:var(--font-sans);font-weight:600;font-size:16px;" disabled>Disabled</button>
    <button style="background:#B81A17;color:#fff;border:none;border-radius:12px;padding:14px 24px;font-family:var(--font-sans);font-weight:600;font-size:16px;">Danger pressed</button>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:#737373;letter-spacing:0.06em;text-transform:uppercase;">primary fills white (dark) / black (light) · pressed = 60% opacity, no scale</div>
</div></body></html>
