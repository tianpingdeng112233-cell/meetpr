<script>
/* Single-file reproduction of the Remotion "Splash 1.2s Fast" composition.
   Canvas 1080x1920, 1.20s. Layers:
     1 Gradient Background / 2 MEETPR Logo / 3 MEETPR Slogan / 4 Loading Line
   Geometry matches the editor composite 1:1: brand layers sit at full composition
   coordinates; the loading-line layer renders inside a 1080x1138.13 viewport that the
   editor places at y=447, so it sits 10px above the composition line position.

   All timings are defined in SECONDS and driven by wall-clock time, so the speed is
   identical at 30fps, 60fps, 120fps or on any display refresh rate. */

const W = 1080, H = 1920, TOTAL_S = 1.2;

const LOGO_ENTER_S   = 0.63333; // logo lands (frame 19 @30fps)
const GLOW_S         = 0.70000; // glow ramp (frame 21 @30fps)
const SLOGAN_START_S = 0.23333; // slogan fade-up start (frame 7)
const SLOGAN_END_S   = 0.83333; // slogan fully resolved (frame 25)

const TW = 196, PW = 57;        // loader track / pill width
const START_S = 0.43333;        // loader appears one frame later (matches the export)
const END_S   = 1.20000;        // single pass: 0.4s -> 1.2s, then holds at the right end
const FADE_S  = 0.26667;        // loader fade-in (8 frames)

/* ---- easing -------------------------------------------------------------- */
function bezier(x1, y1, x2, y2) {
  const A=(a,b)=>1-3*b+3*a, B=(a,b)=>3*b-6*a, C=a=>3*a;
  const cx=(t)=>((A(x1,x2)*t+B(x1,x2))*t+C(x1))*t;
  const cy=(t)=>((A(y1,y2)*t+B(y1,y2))*t+C(y1))*t;
  const dx=(t)=>(3*A(x1,x2)*t+2*B(x1,x2))*t+C(x1);
  return (x)=>{ let t=x;
    for(let i=0;i<6;i++){ const e=cx(t)-x, d=dx(t); if(Math.abs(e)<1e-6||Math.abs(d)<1e-6) break; t-=e/d; }
    return cy(Math.min(1,Math.max(0,t))); };
}
const easeLogo = bezier(0.22, 0.61, 0.24, 1);      // Easing.bezier(0.22,0.61,0.24,1)
const easeOutQ = bezier(0.25, 0.46, 0.45, 0.94);   // Easing.out(quad)
const easeOutC = bezier(0.215, 0.61, 0.355, 1);    // Easing.out(cubic)
const clamp01 = (v)=>Math.min(1,Math.max(0,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const smooth = (t)=>t*t*(3-2*t);

/* ---- elements ------------------------------------------------------------ */
const stage = document.getElementById('stage');
const warm = document.getElementById('warm');
const glow = document.getElementById('glow');

const track = document.getElementById('track');
const pill = document.getElementById('pill');

/* inside the squashed #loaderLayer the composition's own y is used unchanged */
track.style.top = '1121.48px';
track.style.left = ((W - TW) / 2) + 'px';

/* ---- render one moment in time (t in seconds) ---------------------------- */
function render(t) {
  /* Layer 1: gradient background — quick glow ramp + slow warm drift */
  const glowP = easeOutQ(clamp01(t / GLOW_S));
  const warmShift = clamp01(t / (TOTAL_S * 35 / 36));
  warm.style.background =
    'linear-gradient(178deg, rgba(232,150,86,' + (0.10 + 0.05*warmShift).toFixed(4) + ') 0%,' +
    ' rgba(247,241,233,0) 46%,' +
    ' rgba(255,255,255,' + (0.18 + 0.14*warmShift).toFixed(4) + ') 100%)';
  glow.style.background =
    'radial-gradient(56% 34% at 50% 46%, rgba(230,104,30,' + (0.13*glowP).toFixed(4) + ') 0%,' +
    ' rgba(230,104,30,0) 70%)';
  glow.style.transform = 'scale(' + (0.97 + 0.06*glowP).toFixed(4) + ')';

  /* Layer 2: logo — one continuous ease, lands at 0.633s (frame 19) */
  const enter = easeLogo(clamp01(t / LOGO_ENTER_S));
  logoWrap.style.opacity = enter.toFixed(4);
  logoWrap.style.transform =
    'translateY(' + lerp(18,0,enter).toFixed(3) + 'px) scale(' + lerp(0.968,1,enter).toFixed(5) + ')';
  logoWrap.style.filter =
    'drop-shadow(0 ' + (10+6*glowP).toFixed(2) + 'px ' + (24+14*glowP).toFixed(2) +
    'px rgba(16,23,38,' + (0.06+0.06*glowP).toFixed(4) + '))';

  /* Layer 3: slogan — fully resolved at 0.833s (frame 25) */
  const lp = easeOutC(clamp01((t - SLOGAN_START_S) / (SLOGAN_END_S - SLOGAN_START_S)));
  tagline.style.opacity = lp.toFixed(4);
  tagline.style.transform = 'translateY(' + ((1-lp)*14).toFixed(3) + 'px)';
  tagline.style.letterSpacing = lerp(0.024,-0.012,lp).toFixed(4) + 'em';

  /* Layer 4: loading line — ONE pass left -> right (0.4s -> 1.2s), then it holds.
     No alternate/reverse leg: the pill can never travel back to the left. */
  const appear = smooth(clamp01((t - START_S) / FADE_S));
  track.style.background = 'rgba(16,23,38,' + (0.085*appear).toFixed(4) + ')';
  const p = clamp01((t - START_S) / (END_S - START_S));
  const x = -TRAVEL + 2*TRAVEL*smooth(p);
  pill.style.opacity = appear.toFixed(4);
  pill.style.transform = 'translateX(' + (TRAVEL + x).toFixed(3) + 'px)';
}

/* ---- fit the 1080x1920 stage into the viewport --------------------------- */
function fit(){
  const vw = document.documentElement.clientWidth  || window.innerWidth;
  const vh = document.documentElement.clientHeight || window.innerHeight;
  stage.style.transform = 'translate(-50%,-50%) scale(' + Math.min(vw/W, vh/H) + ')';
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
fit();

/* ---- timeline ------------------------------------------------------------ */
/* ?t=1.20 freezes a single moment (useful for design review / screenshots). */
const frozen = new URLSearchParams(location.search).get('t');
if (frozen !== null) {
  render(Math.max(0, parseFloat(frozen) || 0));
} else {
  let t0 = null;
  function tick(now){
    if (t0 === null) t0 = now;
    render((now - t0) / 1000);   // brand stays resolved; loader stops at the right end after 1.2s
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  /* click / tap replays the brand entrance */
  document.addEventListener('click', () => { t0 = null; });
}

/* Hand-off hook: call window.splashDone() once your app is ready to show.
   window.splashDone = () => { stage.style.transition = 'opacity .35s'; stage.style.opacity = 0; }; */
</script>
