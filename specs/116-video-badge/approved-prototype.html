<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>spec 116 视频角标 · 定稿画板</title>
<!-- spec 116 的界面依据。画板 540×960，CSS 里的 px 就是画板单位。
     换算：scale = min(宽, 高×9/16) / 540（导出取视频渲染尺寸，App 内取播放器容器尺寸）。
     背景是纯色示意，不含真实训练视频（仓库公开）。数值与 SPEC.md 冲突时以 SPEC.md 为准。
     字体：IBM Plex Sans / IBM Plex Mono（App 已内置）；本机没装时浏览器会回退到系统字体，以 approved-prototype.png 为准。 -->
<style>
*{box-sizing:border-box;margin:0}
body{background:#F2F3F5;font-family:"IBM Plex Sans","PingFang SC",sans-serif;color:#111827;padding:32px}
h1{font-size:20px;margin-bottom:20px}
.grid{display:flex;flex-wrap:wrap;gap:24px}
figure{width:270px}figcaption{font-size:12px;color:#4B5563;margin-top:8px}
.slot{width:270px;height:480px;overflow:hidden;border-radius:10px}
.ab{width:540px;height:960px;transform:scale(.5);transform-origin:0 0;position:relative;color:#fff}
.ab.dk{background:linear-gradient(160deg,#2B2B30,#101013)}
.ab.lt{background:linear-gradient(160deg,#F4F4F2,#C9CBCC)}

/* ── 角标卡片 ── */
.badge{position:absolute;left:44px;bottom:214px;max-width:452px;border-radius:22px;padding:17px 22px 19px;background:rgba(12,12,14,.45);display:flex;flex-direction:column;font-family:"IBM Plex Sans","PingFang SC",sans-serif}
.badge .h{display:flex;align-items:center;gap:6px;height:23px}
.badge .h .m{width:27px;height:27px;margin:-2px 0;flex:none}
.badge .h .w{height:21px;width:auto}
.badge .set{margin-left:auto;padding-left:24px;font-size:15px;color:rgba(255,255,255,.62);white-space:nowrap}
.badge .bd{display:grid;grid-template:"ex ex" "ld rp"/auto auto;justify-content:start;align-items:baseline;margin-top:12px;row-gap:5px;column-gap:30px}
.badge .bd.nr{grid-template:"ex" "ld"/auto}
.badge .ex{grid-area:ex;font-size:19px;font-weight:500;line-height:1.15;color:rgba(255,255,255,.74);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.badge .ld{grid-area:ld;display:flex;align-items:baseline;gap:7px;white-space:nowrap;line-height:1.05}
.badge .num{font-weight:600;font-variant-numeric:tabular-nums}
.badge .wt,.badge .rep.big{font-size:38px}
.badge .rep{font-size:29px}
.badge .un{font-size:20px;font-weight:500;color:rgba(255,255,255,.58)}
.badge .rp{grid-area:rp;font-size:24px;white-space:nowrap}
.badge .rp i{font-style:normal;font-size:17px;font-weight:500;color:rgba(255,255,255,.58);margin-right:6px}

/* ── App 内收起态 ── */
.dot{position:absolute;left:44px;bottom:150px;width:61px;height:61px;filter:drop-shadow(0 4px 9px rgba(0,0,0,.38))}
.dot .m{width:100%;height:100%}

/* ── 打点：进度条刻度 + 浮出点评 ── */
.sc{position:absolute;left:26px;right:26px;bottom:62px;display:flex;align-items:center;gap:14px;font-family:"IBM Plex Mono",monospace;font-size:17px}
.lt .sc{color:#111827}
.ba{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.3);position:relative}
.lt .ba{background:rgba(0,0,0,.25)}
.ba i{position:absolute;left:0;top:0;bottom:0;width:37.5%;background:#D97706;border-radius:3px}
.ba b{position:absolute;top:-8px;width:5px;height:22px;margin-left:-2.5px;border-radius:3px;background:#FFB800}
.ba u{position:absolute;left:37.5%;top:-9px;width:24px;height:24px;margin-left:-12px;border-radius:50%;background:#fff}
.cue{position:absolute;left:44px;bottom:98px;max-width:452px;display:flex;align-items:baseline;gap:12px;padding:9px 20px;border-radius:999px;background:rgba(12,12,14,.45);font-size:20px;white-space:nowrap;color:#fff}
.cue em{font-style:normal;font-family:"IBM Plex Mono",monospace;font-size:16px;color:#FFB800}
