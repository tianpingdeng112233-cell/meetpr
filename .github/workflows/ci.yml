name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "specs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "specs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift Build & Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Cache SPM build artifacts
        uses: actions/cache@v4
        with:
          path: |
            Modules/*/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Modules/*/Package.swift', 'MeetPR.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build and test Swift packages
        run: |
          for package in Modules/*; do
            if [ -f "$package/Package.swift" ]; then
              echo "::group::swift build $package"
              swift build --package-path "$package"
              echo "::endgroup::"

              echo "::group::swift test $package"
              swift test --package-path "$package" --parallel
              echo "::endgroup::"
            fi
          done

      - name: Xcode build
        run: |
          xcodebuild \
            -project MeetPR.xcodeproj \
            -scheme MeetPR \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Select test simulator
        id: simulator
        run: |
          simulator_name="iPhone 15"
          if ! xcrun simctl list devices available | grep -q "$simulator_name"; then
            simulator_name=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit }')
          fi
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $simulator_name"

      - name: Xcode test
        run: |
          xcodebuild \
            -project MeetPR.xcodeproj \
            -scheme MeetPR \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            test

  lint-format:
    name: swift-format
    runs-on: macos-15
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Swift sources
        id: swift
        run: |
          if [ -n "$(git ls-files '*.swift')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Swift sources tracked — skipping swift-format."
          fi

      - name: Select Xcode
        if: steps.swift.outputs.exists == 'true'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: swift-format lint
        if: steps.swift.outputs.exists == 'true'
        run: xcrun swift-format lint --configuration .swift-format --recursive --strict MeetPR MeetPRTests Modules

  lint-swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Swift sources
        id: swift
        run: |
          if [ -n "$(git ls-files '*.swift')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Swift sources tracked — skipping SwiftLint."
          fi

      - name: SwiftLint
        if: steps.swift.outputs.exists == 'true'
        run: |
          docker run --rm -v "$(pwd):/work" -w /work ghcr.io/realm/swiftlint:latest \
            --strict --reporter github-actions-logging
