name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift Build & Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Swift package
        id: pkg
        run: |
          if [ -f Package.swift ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Package.swift yet — skipping Swift build/test."
          fi

      - name: Select Xcode
        if: steps.pkg.outputs.exists == 'true'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        if: steps.pkg.outputs.exists == 'true'
        run: swift --version

      - name: Swift Package resolve
        if: steps.pkg.outputs.exists == 'true'
        run: swift package resolve

      - name: Build
        if: steps.pkg.outputs.exists == 'true'
        run: swift build -v

      - name: Test
        if: steps.pkg.outputs.exists == 'true'
        run: swift test --parallel

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Swift sources
        id: swift
        run: |
          if [ -n "$(git ls-files '*.swift')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Swift sources tracked — skipping lint."
          fi

      - name: Select Xcode
        if: steps.swift.outputs.exists == 'true'
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: swift-format lint
        if: steps.swift.outputs.exists == 'true'
        run: swift format lint --recursive --strict .

      - name: Install SwiftLint (if missing)
        if: steps.swift.outputs.exists == 'true'
        run: |
          if ! command -v swiftlint &> /dev/null; then
            brew install swiftlint
          fi
          swiftlint version

      - name: SwiftLint
        if: steps.swift.outputs.exists == 'true'
        run: swiftlint --strict --reporter github-actions-logging
