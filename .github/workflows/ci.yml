name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "specs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "specs/**"
      - ".github/ISSUE_TEMPLATE/**"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift Build & Test
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Module boundary checks
        run: |
          if grep -rE "^import StudentKit" Modules/CoachKit; then
            echo "CoachKit must not import StudentKit"
            exit 1
          fi
          if grep -rE "^import CoachKit" Modules/StudentKit; then
            echo "StudentKit must not import CoachKit"
            exit 1
          fi
          if grep -F '"StudentKit"' Modules/CoachKit/Package.swift; then
            echo "CoachKit Package.swift must not depend on StudentKit"
            exit 1
          fi
          if grep -F '"CoachKit"' Modules/StudentKit/Package.swift; then
            echo "StudentKit Package.swift must not depend on CoachKit"
            exit 1
          fi

      - name: Mark build start time
        id: time-start
        run: echo "value=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Cache SPM build artifacts
        uses: actions/cache@v4
        with:
          path: |
            Modules/*/.build
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('Modules/*/Package.swift', 'MeetPR.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Test Swift packages
        run: |
          for package in Modules/*; do
            if [ -f "$package/Package.swift" ]; then
              if [ -d "$package/Tests" ]; then
                echo "::group::swift test $package"
                swift test --package-path "$package" --parallel --enable-code-coverage
                echo "::endgroup::"
              else
                echo "::group::swift build $package (no Tests/)"
                swift build --package-path "$package"
                echo "::endgroup::"
              fi
            fi
          done

      - name: Select test simulator
        id: simulator
        run: |
          simulator_name="iPhone 15"
          if ! xcrun simctl list devices available | grep -q "$simulator_name"; then
            simulator_name=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit }')
          fi
          echo "name=$simulator_name" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $simulator_name"

      - name: Xcode test
        run: |
          xcodebuild \
            -project MeetPR.xcodeproj \
            -scheme MeetPR \
            -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.name }}" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Code Coverage"
            echo ""
            echo "| Source | Line Coverage |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for package in Modules/*; do
            if [ ! -f "$package/Package.swift" ]; then continue; fi
            name=$(basename "$package")
            json=$(swift test --package-path "$package" --enable-code-coverage --show-codecov-path 2>/dev/null || true)
            if [ -n "$json" ] && [ -f "$json" ]; then
              percent=$(jq -r '.data[0].totals.lines.percent // 0 | floor' "$json" 2>/dev/null || echo "n/a")
              echo "| ${name} (SPM) | ${percent}% |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| ${name} (SPM) | n/a |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ -d TestResults.xcresult ]; then
            xc_percent=$(xcrun xccov view --report --json TestResults.xcresult 2>/dev/null \
              | jq -r '.lineCoverage // 0 | . * 100 | floor' 2>/dev/null || echo "n/a")
            echo "| Xcode (App + UI) | ${xc_percent}% |" >> "$GITHUB_STEP_SUMMARY"

            {
              echo ""
              echo "<details><summary>Per-target Xcode breakdown</summary>"
              echo ""
              echo '```'
              xcrun xccov view --report --only-targets TestResults.xcresult 2>&1 || true
              echo '```'
              echo ""
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build duration summary
        if: always()
        run: |
          start=${{ steps.time-start.outputs.value }}
          end=$(date +%s)
          elapsed=$((end - start))
          mins=$((elapsed / 60))
          secs=$((elapsed % 60))
          {
            echo ""
            echo "## Build Duration"
            echo ""
            echo "Total wall time (build + test on \`${{ runner.os }}\`): **${mins}m ${secs}s**"
          } >> "$GITHUB_STEP_SUMMARY"

  lint-format:
    name: swift-format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Swift sources
        id: swift
        run: |
          if [ -n "$(git ls-files '*.swift')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Swift sources tracked — skipping swift-format."
          fi

      - name: swift-format lint
        if: steps.swift.outputs.exists == 'true'
        run: |
          docker run --rm -v "$(pwd):/work" -w /work swift:6.1-jammy \
            swift-format lint --configuration .swift-format --recursive --strict MeetPR MeetPRTests Modules

  lint-swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Swift sources
        id: swift
        run: |
          if [ -n "$(git ls-files '*.swift')" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Swift sources tracked — skipping SwiftLint."
          fi

      - name: SwiftLint
        if: steps.swift.outputs.exists == 'true'
        run: |
          docker run --rm -v "$(pwd):/work" -w /work ghcr.io/realm/swiftlint:latest \
            --strict --reporter github-actions-logging
